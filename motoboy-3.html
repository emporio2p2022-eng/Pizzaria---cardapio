<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Entregas — Pizzaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: #1A1613;
    --bg-elev: #211C18;
    --card: #26201B;
    --card-border: #3A322A;
    --text: #F2EAE0;
    --text-dim: #A89A8A;
    --text-faint: #6E6255;
    --gold: #D9A94F;
    --gold-bg: rgba(217,169,79,0.10);
    --emerald: #4FA876;
    --emerald-bg: rgba(79,168,118,0.10);
    --alerta: #E85D3F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;}

  /* ---------- TELA DE LOGIN ---------- */
  #login{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  #login .moto{font-size:48px; margin-bottom:6px;}
  #login h1{font-family:'Oswald',sans-serif; font-size:24px; font-weight:600; margin:0 0 4px;}
  #login p{color:var(--text-dim); font-size:14px; margin:0 0 28px;}
  .lista-motoboys{width:100%; max-width:340px; display:flex; flex-direction:column; gap:10px;}
  .btn-motoboy{
    background:var(--card); border:1px solid var(--card-border); color:var(--text);
    padding:16px; border-radius:12px; font-size:16px; font-weight:600;
    font-family:'Oswald',sans-serif; cursor:pointer; text-align:left;
    display:flex; align-items:center; gap:12px;
  }
  .btn-motoboy:active{background:var(--gold-bg); border-color:var(--gold);}
  .avatar-letra{
    width:36px; height:36px; border-radius:50%; background:var(--gold-bg); color:var(--gold);
    display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0;
  }
  .sem-motoboy{color:var(--text-faint); font-size:14px; line-height:1.5; max-width:320px;}

  /* ---------- TELA PRINCIPAL ---------- */
  #app{display:none; min-height:100vh;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 18px; background:var(--bg-elev);
    border-bottom:1px solid var(--card-border); position:sticky; top:0; z-index:5;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand h1{font-family:'Oswald',sans-serif; font-weight:600; font-size:19px; margin:0;}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--text-faint); flex-shrink:0;}
  .dot.online{background:var(--emerald); box-shadow:0 0 8px var(--emerald);}
  .sair{background:none; border:none; color:var(--text-faint); font-size:13px; cursor:pointer;}

  main{padding:16px; max-width:640px; margin:0 auto;}
  .secao{margin-bottom:26px;}
  .secao-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;
  }
  .secao-head h2{font-family:'Oswald',sans-serif; font-size:17px; font-weight:600; margin:0;}
  .secao-head .count{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:14px;
    background:var(--gold-bg); color:var(--gold); width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .empty{color:var(--text-faint); text-align:center; padding:24px 10px; font-size:14px;
    background:var(--bg-elev); border-radius:12px; border:1px dashed var(--card-border);}

  .card{
    background:var(--card); border:1px solid var(--card-border); border-radius:14px;
    padding:16px; margin-bottom:12px; border-left:4px solid var(--text-faint);
  }
  .disponivel .card{border-left-color:var(--gold);}
  .minhas .card{border-left-color:var(--emerald);}

  .card-top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
  .numero{font-family:'Oswald',sans-serif; font-size:22px; font-weight:700;}
  .tempo{font-size:13px; color:var(--text-dim); font-weight:500;}

  .endereco{
    font-size:16px; font-weight:600; line-height:1.4; margin-bottom:4px;
  }
  .bairro{font-size:13.5px; color:var(--text-dim); margin-bottom:12px;}

  .linha{display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:8px; color:var(--text);}
  .linha a{color:var(--gold); text-decoration:none; font-weight:600;}

  .pagamento{
    background:rgba(217,169,79,0.10); border:1px solid rgba(217,169,79,0.3);
    border-radius:10px; padding:10px 12px; margin:10px 0; font-size:14px;
  }
  .pagamento .valor{font-family:'Oswald',sans-serif; font-size:19px; font-weight:700; color:var(--gold);}
  .pagamento .troco{color:var(--alerta); font-weight:600; margin-top:2px;}
  .pagamento.ok{background:var(--emerald-bg); border-color:rgba(79,168,118,0.3);}
  .pagamento.ok .valor{color:var(--emerald);}

  .itens-resumo{font-size:13.5px; color:var(--text-dim); margin-bottom:10px;}

  .obs{
    background:rgba(232,93,63,0.10); border:1px solid rgba(232,93,63,0.3); color:var(--alerta);
    padding:8px 10px; border-radius:8px; font-size:13.5px; margin-bottom:12px; font-weight:500;
  }

  button.acao{
    width:100%; border:none; border-radius:10px; padding:14px;
    font-family:'Oswald',sans-serif; font-size:15.5px; font-weight:600;
    letter-spacing:0.3px; cursor:pointer;
  }
  .disponivel button.acao{background:var(--gold); color:#1A1613;}
  .minhas button.acao{background:var(--emerald); color:#fff;}
  button.acao:active{transform:scale(0.97);}
  button.acao:disabled{opacity:0.6;}
</style>
</head>
<body>
<div id="pwGate" style="position:fixed;inset:0;z-index:99999;background:#1c1310;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;">
  <div style="width:100%;max-width:320px;text-align:center;">
    <div style="font-size:40px;margin-bottom:12px;">🔒</div>
    <div style="color:#f3e7d9;font-size:18px;font-weight:600;margin-bottom:18px;">Acesso restrito — Pizzaria 2P</div>
    <input id="pwInput" type="password" placeholder="Senha" autocomplete="off"
      style="width:100%;padding:14px;border-radius:10px;border:1px solid #3a2a22;background:#271b17;color:#f3e7d9;font-size:16px;text-align:center;margin-bottom:12px;box-sizing:border-box;">
    <button id="pwBtn" style="width:100%;padding:14px;border-radius:10px;border:none;background:#e2683f;color:#fff;font-size:16px;font-weight:600;">Entrar</button>
    <div id="pwErr" style="color:#e2683f;font-size:13px;margin-top:10px;display:none;">Senha errada, tenta de novo.</div>
  </div>
</div>
<script>
(function(){
  var KEY = 'pizza2p_auth_v1';
  var SENHA = '2p2026';
  if(localStorage.getItem(KEY) === 'ok'){
    document.getElementById('pwGate').remove();
    return;
  }
  function tentar(){
    var val = document.getElementById('pwInput').value.trim();
    if(val === SENHA){
      localStorage.setItem(KEY, 'ok');
      document.getElementById('pwGate').remove();
    } else {
      document.getElementById('pwErr').style.display = 'block';
    }
  }
  document.getElementById('pwBtn').addEventListener('click', tentar);
  document.getElementById('pwInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') tentar();
  });
})();
</script>


<!-- LOGIN -->
<div id="login">
  <div class="moto">🛵</div>
  <h1 id="nomePizzariaLogin">Entregas</h1>
  <p>Quem é você?</p>
  <div class="lista-motoboys" id="listaMotoboys">
    <div class="sem-motoboy">Carregando...</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="brand">
      <h1 id="nomeMotoboy">Motoboy</h1>
      <div class="dot" id="connDot"></div>
    </div>
    <button class="sair" id="btnSair">trocar</button>
  </header>

  <main>
    <div class="secao disponivel">
      <div class="secao-head"><h2>Disponíveis para pegar</h2><span class="count" id="countDisp">0</span></div>
      <div id="colDisponiveis"></div>
    </div>

    <div class="secao minhas">
      <div class="secao-head"><h2>Minhas entregas</h2><span class="count" id="countMinhas">0</span></div>
      <div id="colMinhas"></div>
    </div>
  </main>
</div>

<script>
const SUPABASE_URL = 'https://udqsxybmoomokgmhhubh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_y-3D9y_mQP5SvmUbVmbClg_5YSgU2sX';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let motoboyAtual = null; // {id, nome}
let primeiraCarga = true;

async function carregarNomePizzaria(){
  const {data} = await client.from('config_sistema').select('nome_pizzaria').eq('id',1).single();
  if(data && data.nome_pizzaria){
    document.getElementById('nomePizzariaLogin').textContent = 'Entregas — ' + data.nome_pizzaria;
  }
}

async function carregarMotoboys(){
  const {data, error} = await client.from('motoboys').select('id,nome').eq('ativo', true).order('nome');
  const lista = document.getElementById('listaMotoboys');
  lista.innerHTML = '';

  if(error || !data || data.length === 0){
    lista.innerHTML = `<div class="sem-motoboy">Nenhum motoboy cadastrado ainda.<br><br>Peça pro dono cadastrar os motoboys no painel de administração.</div>`;
    return;
  }

  data.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'btn-motoboy';
    btn.innerHTML = `<span class="avatar-letra">${m.nome.charAt(0).toUpperCase()}</span> ${m.nome}`;
    btn.addEventListener('click', () => entrar(m));
    lista.appendChild(btn);
  });
}

function entrar(motoboy){
  motoboyAtual = motoboy;
  localStorage.setItem('motoboy_id', motoboy.id);
  localStorage.setItem('motoboy_nome', motoboy.nome);
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('nomeMotoboy').textContent = motoboy.nome;
  iniciarApp();
}

document.getElementById('btnSair').addEventListener('click', () => {
  localStorage.removeItem('motoboy_id');
  localStorage.removeItem('motoboy_nome');
  location.reload();
});

function tempoDecorrido(criadoEm){
  const min = Math.floor((Date.now() - new Date(criadoEm).getTime()) / 60000);
  if(min < 1) return 'agora';
  return `há ${min} min`;
}

function infoPagamento(pedido){
  if(pedido.forma_pagamento === 'pix_antecipado' || pedido.pagamento_status === 'confirmado'){
    return `<div class="pagamento ok">✓ Já pago (${formaLabel(pedido.forma_pagamento)})</div>`;
  }
  const valor = Number(pedido.valor_total || 0).toFixed(2).replace('.', ',');
  let troco = '';
  if(pedido.forma_pagamento === 'dinheiro' && pedido.precisa_troco && pedido.troco_para){
    const trocoCalc = pedido.troco_calculado != null
      ? Number(pedido.troco_calculado).toFixed(2).replace('.', ',')
      : (Number(pedido.troco_para) - Number(pedido.valor_total)).toFixed(2).replace('.', ',');
    troco = `<div class="troco">Cliente vai pagar com R$ ${Number(pedido.troco_para).toFixed(2).replace('.', ',')} — levar R$ ${trocoCalc} de troco</div>`;
  }
  return `<div class="pagamento"><div class="valor">Cobrar R$ ${valor}</div>${formaLabel(pedido.forma_pagamento)}${troco}</div>`;
}

function formaLabel(forma){
  const nomes = {
    'pix_antecipado': 'Pix (já pago)',
    'pix_entrega': 'Pix na entrega',
    'cartao_entrega': 'Cartão na entrega',
    'dinheiro': 'Dinheiro na entrega'
  };
  return nomes[forma] || forma || '';
}

function criarCardDisponivel(pedido){
  const card = document.createElement('div');
  card.className = 'card';
  const end = pedido.enderecos_clientes || {};
  const cli = pedido.clientes || {};
  const nItens = (pedido.itens_pedido || []).length;

  card.innerHTML = `
    <div class="card-top">
      <span class="numero">#${pedido.numero}</span>
      <span class="tempo">pronto ${tempoDecorrido(pedido.atualizado_em || pedido.criado_em)}</span>
    </div>
    <div class="endereco">${end.endereco || ''}${end.numero ? ', ' + end.numero : ''}</div>
    <div class="bairro">${end.bairro || ''}${end.complemento ? ' · ' + end.complemento : ''}</div>
    <div class="itens-resumo">${nItens} ${nItens === 1 ? 'item' : 'itens'}</div>
    ${infoPagamento(pedido)}
    ${pedido.observacoes ? `<div class="obs">⚠️ ${pedido.observacoes}</div>` : ''}
    <button class="acao">Pegar essa entrega</button>
  `;

  card.querySelector('button.acao').addEventListener('click', async () => {
    const btn = card.querySelector('button.acao');
    if(btn.disabled) return;
    btn.disabled = true; btn.textContent = 'Pegando...';
    const {error} = await client.from('pedidos')
      .update({status: 'saiu_entrega', motoboy_id: motoboyAtual.id})
      .eq('id', pedido.id)
      .eq('status', 'aguardando_motoboy'); // evita dois motoboys pegarem o mesmo pedido
    if(error){
      alert('Não consegui pegar essa entrega. Talvez outro motoboy já tenha pegado — a tela vai atualizar.');
      btn.disabled = false; btn.textContent = 'Pegar essa entrega';
      carregarPedidos().catch(() => {});
      return;
    }
    btn.textContent = 'Feito ✓';
    card.style.transition = 'opacity 0.3s';
    card.style.opacity = '0.3';
    setTimeout(() => card.remove(), 450);
    carregarPedidos().catch(() => {});
  });

  return card;
}

function criarCardMinha(pedido){
  const card = document.createElement('div');
  card.className = 'card';
  const end = pedido.enderecos_clientes || {};
  const cli = pedido.clientes || {};

  card.innerHTML = `
    <div class="card-top">
      <span class="numero">#${pedido.numero}</span>
      <span class="tempo">saiu ${tempoDecorrido(pedido.atualizado_em || pedido.criado_em)}</span>
    </div>
    <div class="endereco">${end.endereco || ''}${end.numero ? ', ' + end.numero : ''}</div>
    <div class="bairro">${end.bairro || ''}${end.complemento ? ' · ' + end.complemento : ''}</div>
    ${cli.telefone ? `<div class="linha">📞 <a href="tel:${cli.telefone}">${cli.telefone}</a></div>` : ''}
    ${infoPagamento(pedido)}
    ${pedido.observacoes ? `<div class="obs">⚠️ ${pedido.observacoes}</div>` : ''}
    <button class="acao">Confirmar entrega</button>
  `;

  card.querySelector('button.acao').addEventListener('click', async () => {
    const btn = card.querySelector('button.acao');
    if(btn.disabled) return;
    btn.disabled = true; btn.textContent = 'Confirmando...';
    const updates = {status: 'entregue'};
    if(pedido.forma_pagamento !== 'pix_antecipado'){
      updates.pagamento_status = 'confirmado';
    }
    const {error} = await client.from('pedidos').update(updates).eq('id', pedido.id);
    if(error){
      alert('Não consegui confirmar. Verifica a internet e tenta de novo.');
      btn.disabled = false; btn.textContent = 'Confirmar entrega';
      return;
    }
    btn.textContent = 'Feito ✓';
    card.style.transition = 'opacity 0.3s';
    card.style.opacity = '0.3';
    setTimeout(() => card.remove(), 450);
    carregarPedidos().catch(() => {});
  });

  return card;
}

async function carregarPedidos(){
  const [disp, minhas] = await Promise.all([
    client.from('pedidos')
      .select('*, enderecos_clientes(endereco,numero,bairro,complemento), clientes(nome,telefone), itens_pedido(id)')
      .eq('status', 'aguardando_motoboy')
      .order('atualizado_em', {ascending:true}),
    client.from('pedidos')
      .select('*, enderecos_clientes(endereco,numero,bairro,complemento), clientes(nome,telefone), itens_pedido(id)')
      .eq('status', 'saiu_entrega')
      .eq('motoboy_id', motoboyAtual.id)
      .order('atualizado_em', {ascending:true})
  ]);

  document.getElementById('connDot').className = 'dot online';

  const colDisp = document.getElementById('colDisponiveis');
  const colMinhas = document.getElementById('colMinhas');
  colDisp.innerHTML = ''; colMinhas.innerHTML = '';

  const listaDisp = disp.data || [];
  const listaMinhas = minhas.data || [];

  if(listaDisp.length === 0){
    colDisp.innerHTML = '<div class="empty">Nenhuma entrega disponível agora</div>';
  } else {
    listaDisp.forEach(p => colDisp.appendChild(criarCardDisponivel(p)));
  }

  if(listaMinhas.length === 0){
    colMinhas.innerHTML = '<div class="empty">Você não tem entregas em andamento</div>';
  } else {
    listaMinhas.forEach(p => colMinhas.appendChild(criarCardMinha(p)));
  }

  document.getElementById('countDisp').textContent = listaDisp.length;
  document.getElementById('countMinhas').textContent = listaMinhas.length;
  primeiraCarga = false;
}

function iniciarApp(){
  carregarPedidos();

  client
    .channel('motoboy-pedidos-' + motoboyAtual.id)
    .on('postgres_changes', {event:'*', schema:'public', table:'pedidos'}, () => carregarPedidos())
    .subscribe((status) => {
      if(status === 'SUBSCRIBED') document.getElementById('connDot').className = 'dot online';
    });

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && !primeiraCarga) carregarPedidos();
  });

  setInterval(() => { if(!primeiraCarga) carregarPedidos(); }, 30000);
}

// inicialização — se já tem motoboy salvo no celular, entra direto
(async () => {
  await carregarNomePizzaria();
  await carregarMotoboys();

  const idSalvo = localStorage.getItem('motoboy_id');
  const nomeSalvo = localStorage.getItem('motoboy_nome');
  if(idSalvo && nomeSalvo){
    entrar({id: idSalvo, nome: nomeSalvo});
  }
})();
</script>

</body>
</html>
