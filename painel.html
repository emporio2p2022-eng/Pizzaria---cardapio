<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Painel — Pizzaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{
    --bg: #FAF6EC;
    --bg-elev: #FFFFFF;
    --card: #FFFFFF;
    --card-border: #EEE3CE;
    --text: #221C16;
    --text-dim: #7A6E5E;
    --text-faint: #A89A85;
    --tomate: #E85D3F;
    --tomate-2: #C6431F;
    --tomate-bg: rgba(232,93,63,0.10);
    --gold: #C9860B;
    --gold-2: #A96C08;
    --gold-bg: rgba(217,169,79,0.18);
    --emerald: #2E9E5B;
    --emerald-bg: rgba(46,158,91,0.12);
    --shadow-sm: 0 2px 10px rgba(60,45,25,0.07);
    --shadow-md: 0 10px 26px -8px rgba(60,45,25,0.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;}
  body{
    padding-bottom:40px;
    background-image:
      radial-gradient(circle at 100% 0%, rgba(217,169,79,0.10) 0%, transparent 40%),
      radial-gradient(circle at 0% 40%, rgba(232,93,63,0.07) 0%, transparent 35%);
    background-attachment: fixed;
  }
  h1,h2,h3{font-family:'Oswald',sans-serif; margin:0;}
  button{font-family:inherit;}

  header{
    position:sticky; top:0; z-index:10; background:var(--bg-elev);
    border-bottom:1px solid var(--card-border); padding:14px 16px 0;
    box-shadow:var(--shadow-sm);
  }
  .header-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .header-top h1{font-size:19px; font-weight:700; display:flex; align-items:center; gap:8px; color:var(--text);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--text-faint);}
  .dot.online{background:var(--emerald); box-shadow:0 0 6px var(--emerald);}

  .tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0; padding:9px 14px; border-radius:10px 10px 0 0; border:none;
    background:transparent; color:var(--text-dim); font-size:14px; font-weight:600; cursor:pointer;
    transition:color 0.15s ease;
  }
  .tab.ativa{background:var(--card); color:var(--tomate); border-bottom:2px solid var(--tomate); box-shadow:var(--shadow-sm);}

  main{padding:16px; max-width:720px; margin:0 auto;}
  .secao{display:none;}
  .secao.ativa{display:block;}

  .subtabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; scrollbar-width:none;}
  .subtabs::-webkit-scrollbar{display:none;}
  .subtab{
    flex-shrink:0; padding:7px 13px; border-radius:16px; border:1px solid var(--card-border);
    background:var(--card); color:var(--text-dim); font-size:13px; font-weight:600; cursor:pointer;
    transition:transform 0.15s ease;
  }
  .subtab:active{transform:scale(0.96);}
  .subtab.ativa{
    background:linear-gradient(155deg, var(--gold) 0%, var(--gold-2) 100%);
    border-color:var(--gold); color:#fff; box-shadow:0 6px 14px -6px rgba(201,134,11,0.5);
  }

  .filtros{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .filtro{
    padding:6px 12px; border-radius:14px; border:1px solid var(--card-border); background:var(--card);
    color:var(--text-dim); font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .filtro.ativa{
    background:linear-gradient(155deg, var(--tomate) 0%, var(--tomate-2) 100%);
    border-color:var(--tomate); color:#fff; box-shadow:0 6px 14px -6px rgba(232,93,63,0.5);
  }

  .card{
    background:var(--card); border:1px solid var(--card-border); border-radius:14px;
    padding:14px; margin-bottom:10px; box-shadow:var(--shadow-sm);
  }
  .empty{color:var(--text-faint); text-align:center; padding:30px 10px; font-size:14px;}

  /* pedidos */
  .pedido-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; cursor:pointer;}
  .pedido-numero{font-family:'Oswald',sans-serif; font-size:18px; font-weight:700; color:var(--text);}
  .status-badge{
    font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:12px; text-transform:uppercase;
    letter-spacing:0.3px;
  }
  .status-badge.novo{background:var(--tomate-bg); color:var(--tomate-2);}
  .status-badge.andamento{background:var(--gold-bg); color:var(--gold-2);}
  .status-badge.concluido{background:var(--emerald-bg); color:var(--emerald);}
  .status-badge.cancelado{background:rgba(232,93,63,0.18); color:#B23A2E;}
  .pedido-info{font-size:13.5px; color:var(--text-dim); margin-bottom:2px;}
  .pedido-detalhe{display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--card-border); font-size:13.5px;}
  .pedido-detalhe.mostrar{display:block;}
  .pedido-detalhe .item{margin-bottom:6px; color:var(--text);}
  .pedido-detalhe .item .extra{display:block; color:var(--text-dim); font-size:12.5px; margin-left:14px;}
  .btn-cancelar{
    margin-top:10px; background:none; border:1px solid rgba(232,93,63,0.4); color:var(--tomate-2);
    border-radius:8px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .acoes-detalhe{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .btn-whatsapp-pedido{
    background:var(--emerald-bg); border:1px solid rgba(46,158,91,0.35); color:var(--emerald);
    border-radius:8px; padding:10px 12px; font-size:13.5px; font-weight:700; cursor:pointer;
    transition:transform 0.15s ease;
  }
  .btn-whatsapp-pedido:active{transform:scale(0.98);}

  /* forms genéricos usados em cardápio/entregas */
  .lista-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--card); border:1px solid var(--card-border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; box-shadow:var(--shadow-sm);
  }
  .lista-item.inativo{opacity:0.45;}
  .lista-item .nome-item{font-weight:700; font-size:15px; color:var(--text);}
  .lista-item .sub-item{font-size:12.5px; color:var(--text-dim); margin-top:2px;}
  .lista-item .acoes{display:flex; gap:8px; flex-shrink:0;}
  .icone-btn{
    background:none; border:1px solid var(--card-border); border-radius:8px; width:32px; height:32px;
    color:var(--text-dim); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;
  }
  .icone-btn.perigo{color:var(--tomate-2); border-color:rgba(232,93,63,0.35);}
  .icone-btn.sucesso{color:var(--emerald); border-color:rgba(46,158,91,0.35);}

  .form-add{
    background:var(--card); border:1.5px dashed var(--card-border); border-radius:14px;
    padding:14px; margin-bottom:16px;
  }
  .campo{margin-bottom:12px;}
  .campo label{display:block; font-size:13px; color:var(--text-dim); margin-bottom:5px; font-weight:600;}
  .campo input[type=text], .campo input[type=number], .campo input[type=tel], .campo select, .campo textarea{
    width:100%; background:var(--bg); border:1px solid var(--card-border); color:var(--text);
    border-radius:9px; padding:10px 12px; font-size:14.5px; font-family:inherit;
  }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}

  .checkbox-linha{display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:10px;}
  .checkbox-linha input{width:18px; height:18px; accent-color:var(--tomate);}

  .btn-primario{
    background:linear-gradient(155deg, var(--tomate) 0%, var(--tomate-2) 100%); color:#fff; border:none; border-radius:10px;
    padding:11px 18px; font-size:14.5px; font-weight:600; font-family:'Oswald',sans-serif; cursor:pointer;
    box-shadow:0 8px 16px -6px rgba(232,93,63,0.5); transition:transform 0.15s ease;
  }
  .btn-primario:active{transform:scale(0.97);}
  .btn-primario:disabled{opacity:0.45; box-shadow:none;}
  .btn-full{width:100%;}
  .btn-secundario{
    background:var(--card); color:var(--text); border:1px solid var(--card-border); border-radius:10px;
    padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer;
  }

  .kpis{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .kpi{background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:14px; box-shadow:var(--shadow-sm);}
  .kpi .valor{font-family:'Oswald',sans-serif; font-size:26px; font-weight:700; color:var(--gold);}
  .kpi .rotulo{font-size:12.5px; color:var(--text-dim); margin-top:2px;}

  .loading-tela{text-align:center; color:var(--text-faint); padding:40px 10px;}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1><span>⚙️</span> <span id="nomePizzariaHeader">Painel</span> <span class="dot" id="connDot"></span></h1>
  </div>
  <div class="tabs">
    <button class="tab ativa" data-tab="pedidos">Pedidos</button>
    <button class="tab" data-tab="cardapio">Cardápio</button>
    <button class="tab" data-tab="entregas">Entregas</button>
    <button class="tab" data-tab="config">Config</button>
  </div>
</header>

<main>
  <!-- ABA PEDIDOS -->
  <section class="secao ativa" id="secaoPedidos">
    <div class="kpis" id="kpis"></div>
    <div class="filtros" id="filtrosPedidos"></div>
    <div id="listaPedidos"><div class="loading-tela">Carregando...</div></div>
  </section>

  <!-- ABA CARDÁPIO -->
  <section class="secao" id="secaoCardapio">
    <div class="subtabs" id="subtabsCardapio"></div>
    <div id="conteudoCardapio"></div>
  </section>

  <!-- ABA ENTREGAS -->
  <section class="secao" id="secaoEntregas">
    <div class="subtabs" id="subtabsEntregas"></div>
    <div id="conteudoEntregas"></div>
  </section>

  <!-- ABA CONFIG -->
  <section class="secao" id="secaoConfig">
    <div id="conteudoConfig"><div class="loading-tela">Carregando...</div></div>
  </section>
</main>

<script>
const SUPABASE_URL = 'https://udqsxybmoomokgmhhubh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_y-3D9y_mQP5SvmUbVmbClg_5YSgU2sX';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function formatarPreco(v){ return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ','); }
function formatarData(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

// ---------------- NAVEGAÇÃO POR ABAS ----------------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativa'));
    document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
    tab.classList.add('ativa');
    document.getElementById('secao' + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)).classList.add('ativa');
  });
});

async function carregarNomePizzaria(){
  const {data} = await client.from('config_sistema').select('nome_pizzaria').eq('id',1).single();
  if(data && data.nome_pizzaria) document.getElementById('nomePizzariaHeader').textContent = data.nome_pizzaria;
}

// ---------------- PEDIDOS ----------------
const GRUPOS_STATUS = {
  novo: ['novo','cliente_confirmou','enviado_cozinha','aceito_cozinha'],
  andamento: ['em_preparo','pronto','aguardando_motoboy','saiu_entrega','aguardando_retirada'],
  concluido: ['entregue','retirado','pagamento_confirmado','finalizado'],
  cancelado: ['cancelado']
};

const LABEL_STATUS = {
  novo:'Novo', cliente_confirmou:'Confirmado', enviado_cozinha:'Na cozinha', aceito_cozinha:'Aceito',
  em_preparo:'Preparando', pronto:'Pronto', aguardando_motoboy:'Aguardando motoboy', saiu_entrega:'Saiu p/ entrega',
  entregue:'Entregue', aguardando_retirada:'Aguardando retirada', retirado:'Retirado',
  pagamento_confirmado:'Pago', finalizado:'Finalizado', cancelado:'Cancelado'
};

let filtroPedidoAtivo = 'ativos';
let pedidosCache = [];

function grupoDoStatus(status){
  for(const [g, lista] of Object.entries(GRUPOS_STATUS)) if(lista.includes(status)) return g;
  return 'novo';
}

async function carregarPedidos(){
  const inicioHoje = new Date(); inicioHoje.setHours(0,0,0,0);
  const {data, error} = await client
    .from('pedidos')
    .select('*, clientes(nome,telefone), enderecos_clientes(bairro), itens_pedido(*, itens_pedido_adicionais(*))')
    .gte('criado_em', inicioHoje.toISOString())
    .order('criado_em', {ascending:false});

  document.getElementById('connDot').className = 'dot' + (error ? '' : ' online');
  if(error){ document.getElementById('listaPedidos').innerHTML = '<div class="empty">Erro ao carregar. Puxe pra atualizar.</div>'; return; }

  pedidosCache = data || [];
  renderKpis();
  renderFiltros();
  renderListaPedidos();
}

function renderKpis(){
  const total = pedidosCache.filter(p => p.status !== 'cancelado').length;
  const faturamento = pedidosCache
    .filter(p => ['entregue','retirado','pagamento_confirmado','finalizado'].includes(p.status))
    .reduce((s,p) => s + Number(p.valor_total || 0), 0);
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="valor">${total}</div><div class="rotulo">pedidos hoje</div></div>
    <div class="kpi"><div class="valor">${formatarPreco(faturamento)}</div><div class="rotulo">faturado hoje</div></div>
  `;
}

function renderFiltros(){
  const grupos = [
    {id:'ativos', label:'Em andamento'},
    {id:'concluido', label:'Concluídos'},
    {id:'cancelado', label:'Cancelados'},
    {id:'todos', label:'Todos'},
  ];
  document.getElementById('filtrosPedidos').innerHTML = grupos.map(g => `
    <button class="filtro ${filtroPedidoAtivo === g.id ? 'ativa' : ''}" data-filtro="${g.id}">${g.label}</button>
  `).join('');
  document.querySelectorAll('[data-filtro]').forEach(el => el.addEventListener('click', () => {
    filtroPedidoAtivo = el.getAttribute('data-filtro');
    renderFiltros();
    renderListaPedidos();
  }));
}

// ---------------- COMPARTILHAR PEDIDO NO WHATSAPP ----------------
function montarConteudoPedido(p){
  const cliente = p.clientes ? (p.clientes.nome || p.clientes.telefone) : 'Cliente';
  const bairro = p.enderecos_clientes ? (p.enderecos_clientes.bairro || '') : '';
  const agora = formatarData(p.criado_em);

  const itensHtml = (p.itens_pedido || []).map(it => `
    <div style="font-size:15px; font-weight:700; color:#221C16; margin-top:8px;">
      <span style="color:#C9860B; font-weight:800;">${it.quantidade}×</span> ${it.tipo_item}
    </div>
    ${it.observacoes ? `<div style="font-size:12.5px; color:#7A6E5E; margin-left:18px;">obs: ${it.observacoes}</div>` : ''}
  `).join('');

  return `
    <div style="font-family:'Inter',sans-serif; width:320px; background:#FFFFFF; border-radius:20px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.15);">
      <div style="background:linear-gradient(155deg,#E85D3F 0%,#C6431F 100%); padding:18px 20px; text-align:center;">
        <div style="color:#fff; font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:1px; text-transform:uppercase; opacity:0.9;">Pizza Card</div>
        <div style="color:#fff; font-family:'Oswald',sans-serif; font-size:38px; font-weight:700; line-height:1.1;">#${p.numero}</div>
        <div style="color:#FCE4DA; font-size:12px; margin-top:2px;">${agora}</div>
      </div>
      <div style="padding:18px 20px;">
        <div style="font-size:14px; font-weight:700; color:#221C16;">${cliente}</div>
        ${bairro ? `<div style="font-size:13px; color:#7A6E5E; margin-bottom:8px;">📍 ${bairro}</div>` : ''}
        <div style="border-top:2px dashed #EEE3CE; padding-top:10px; margin-top:8px;">
          ${itensHtml || '<div style="font-size:14px;color:#7A6E5E;">Sem itens</div>'}
        </div>
        ${p.observacoes ? `<div style="background:#FFF6E0; border:1px solid #F0DFAE; color:#8A5D07; padding:10px 12px; border-radius:10px; font-size:13px; font-weight:600; margin-top:14px;">⚠ ${p.observacoes}</div>` : ''}
        <div style="border-top:1px solid #EEE3CE; margin-top:14px; padding-top:10px; display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:13px; color:#7A6E5E; font-weight:600;">Total</span>
          <span style="font-family:'Oswald',sans-serif; font-size:20px; font-weight:700; color:#C9860B;">${formatarPreco(p.valor_total)}</span>
        </div>
      </div>
      <div style="background:#FAF6EC; text-align:center; padding:10px; font-size:11px; color:#A89A85; font-weight:600;">O sabor de vender sem complicação</div>
    </div>
  `;
}

async function compartilharPedidoWhatsApp(pedido){
  const conteudo = montarConteudoPedido(pedido);
  const offscreen = document.createElement('div');
  offscreen.style.cssText = 'position:fixed; left:-9999px; top:0;';
  offscreen.innerHTML = conteudo;
  document.body.appendChild(offscreen);

  try {
    const canvas = await html2canvas(offscreen.firstElementChild, {scale:2, backgroundColor:'#FFFFFF'});
    canvas.toBlob(async (blob) => {
      document.body.removeChild(offscreen);
      if(!blob) return;
      const arquivo = new File([blob], `pedido-${pedido.numero}.png`, {type:'image/png'});

      if(navigator.canShare && navigator.canShare({files:[arquivo]})){
        try {
          await navigator.share({files:[arquivo], title:`Pedido #${pedido.numero}`});
        } catch(e){ /* usuário cancelou, tudo bem */ }
      } else {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `pedido-${pedido.numero}.png`;
        link.click();
        alert('Imagem baixada. Envie ela pelo WhatsApp manualmente.');
      }
    }, 'image/png');
  } catch(e){
    document.body.removeChild(offscreen);
    alert('Não consegui gerar a imagem do pedido.');
  }
}

function renderListaPedidos(){
  let lista = pedidosCache;
  if(filtroPedidoAtivo === 'ativos') lista = lista.filter(p => ['novo','andamento'].includes(grupoDoStatus(p.status)));
  else if(filtroPedidoAtivo !== 'todos') lista = lista.filter(p => grupoDoStatus(p.status) === filtroPedidoAtivo);

  const cont = document.getElementById('listaPedidos');
  if(lista.length === 0){ cont.innerHTML = '<div class="empty">Nenhum pedido aqui</div>'; return; }

  cont.innerHTML = lista.map(p => {
    const grupo = grupoDoStatus(p.status);
    const cliente = p.clientes ? (p.clientes.nome || p.clientes.telefone) : 'Cliente';
    const itens = (p.itens_pedido || []).length;
    return `
    <div class="card">
      <div class="pedido-top" data-toggle="${p.id}">
        <span class="pedido-numero">#${p.numero}</span>
        <span class="status-badge ${grupo}">${LABEL_STATUS[p.status] || p.status}</span>
      </div>
      <div class="pedido-info">${cliente} · ${itens} ${itens===1?'item':'itens'} · ${formatarPreco(p.valor_total)}</div>
      <div class="pedido-info">${formatarData(p.criado_em)}</div>
      <div class="pedido-detalhe" id="detalhe-${p.id}">
        ${(p.itens_pedido||[]).map(it => `<div class="item">${it.quantidade}x ${it.tipo_item}${it.observacoes ? '<span class="extra">obs: '+it.observacoes+'</span>' : ''}</div>`).join('') || '<div class="item">Sem itens</div>'}
        ${p.observacoes ? `<div class="item">⚠️ ${p.observacoes}</div>` : ''}
        ${p.enderecos_clientes ? `<div class="item">📍 ${p.enderecos_clientes.bairro || ''}</div>` : ''}
        <div class="acoes-detalhe">
          <button class="btn-whatsapp-pedido" data-whatsapp="${p.id}">📲 Enviar no WhatsApp</button>
          ${grupo !== 'cancelado' && grupo !== 'concluido' ? `<button class="btn-cancelar" data-cancelar="${p.id}">Cancelar pedido</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', () => {
    document.getElementById('detalhe-' + el.getAttribute('data-toggle')).classList.toggle('mostrar');
  }));
  document.querySelectorAll('[data-whatsapp]').forEach(el => el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const pedido = pedidosCache.find(p => p.id === el.getAttribute('data-whatsapp'));
    if(pedido) compartilharPedidoWhatsApp(pedido);
  }));
  document.querySelectorAll('[data-cancelar]').forEach(el => el.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    const motivo = prompt('Motivo do cancelamento (opcional):');
    if(motivo === null) return;
    await client.from('pedidos').update({status:'cancelado', motivo_cancelamento: motivo || null, cancelado_por:'dono'}).eq('id', el.getAttribute('data-cancelar'));
    carregarPedidos();
  }));
}

client.channel('painel-pedidos').on('postgres_changes', {event:'*', schema:'public', table:'pedidos'}, () => carregarPedidos()).subscribe();
setInterval(carregarPedidos, 30000);

// ---------------- CARDÁPIO (CRUD) ----------------
const CARDAPIO_ABAS = [
  {id:'categorias', label:'Categorias', campos:[
    {key:'nome', label:'Nome', type:'text'},
    {key:'ordem', label:'Ordem', type:'number', default:0}
  ]},
  {id:'tamanhos', label:'Tamanhos', campos:[
    {key:'nome', label:'Nome', type:'text'},
    {key:'max_sabores', label:'Máx. sabores (2 = permite meio a meio)', type:'number', default:1},
    {key:'ordem', label:'Ordem', type:'number', default:0}
  ]},
  {id:'sabores', label:'Sabores', especial:'sabores'},
  {id:'bordas', label:'Bordas', campos:[
    {key:'nome', label:'Nome', type:'text'},
    {key:'preco', label:'Preço adicional', type:'number', default:0}
  ]},
  {id:'adicionais', label:'Adicionais', campos:[
    {key:'nome', label:'Nome', type:'text'},
    {key:'preco', label:'Preço', type:'number', default:0}
  ]},
  {id:'bebidas', label:'Bebidas', campos:[
    {key:'nome', label:'Nome', type:'text'},
    {key:'preco', label:'Preço', type:'number', default:0}
  ]},
  {id:'combos', label:'Combos', campos:[
    {key:'nome', label:'Nome', type:'text'},
    {key:'descricao', label:'Descrição (opcional)', type:'text', opcional:true},
    {key:'preco', label:'Preço', type:'number', default:0}
  ]},
];

let subAbaCardapioAtiva = 'categorias';
let cacheCardapio = {}; // tabela -> linhas
let cacheTamanhosGlobal = []; // usado pela aba sabores

function montarSubtabsCardapio(){
  document.getElementById('subtabsCardapio').innerHTML = CARDAPIO_ABAS.map(a => `
    <button class="subtab ${subAbaCardapioAtiva === a.id ? 'ativa' : ''}" data-subaba="${a.id}">${a.label}</button>
  `).join('');
  document.querySelectorAll('[data-subaba]').forEach(el => el.addEventListener('click', () => {
    subAbaCardapioAtiva = el.getAttribute('data-subaba');
    montarSubtabsCardapio();
    renderConteudoCardapio();
  }));
}

async function renderConteudoCardapio(){
  const cont = document.getElementById('conteudoCardapio');
  cont.innerHTML = '<div class="loading-tela">Carregando...</div>';
  const abaCfg = CARDAPIO_ABAS.find(a => a.id === subAbaCardapioAtiva);

  if(abaCfg.especial === 'sabores'){
    await renderAbaSabores();
    return;
  }

  const ordemCol = abaCfg.campos.find(c => c.key === 'ordem') ? 'ordem' : 'nome';
  const {data} = await client.from(abaCfg.id).select('*').order(ordemCol);
  cacheCardapio[abaCfg.id] = data || [];

  cont.innerHTML = `
    <div class="form-add" id="formAdd-${abaCfg.id}"></div>
    <div id="listaCrud-${abaCfg.id}"></div>
  `;
  renderFormAdd(abaCfg);
  renderListaCrud(abaCfg);
}

function renderFormAdd(abaCfg){
  const el = document.getElementById('formAdd-' + abaCfg.id);
  el.innerHTML = `
    <h3 style="font-size:14px; margin-bottom:12px; color:var(--text-dim);">Adicionar ${abaCfg.label.toLowerCase()}</h3>
    ${abaCfg.campos.map(c => `
      <div class="campo">
        <label>${c.label}</label>
        <input type="${c.type === 'number' ? 'number' : 'text'}" id="novo-${abaCfg.id}-${c.key}" ${c.type==='number' ? 'step="0.01"' : ''} placeholder="${c.default !== undefined ? c.default : ''}">
      </div>
    `).join('')}
    <button class="btn-primario btn-full" id="btnSalvarNovo-${abaCfg.id}">Adicionar</button>
  `;
  document.getElementById('btnSalvarNovo-' + abaCfg.id).addEventListener('click', async () => {
    const payload = {};
    for(const c of abaCfg.campos){
      const val = document.getElementById(`novo-${abaCfg.id}-${c.key}`).value;
      if(!val && !c.opcional && c.type !== 'number'){ alert('Preenche o campo "' + c.label + '"'); return; }
      payload[c.key] = c.type === 'number' ? (val ? Number(val) : (c.default || 0)) : (val || null);
    }
    const {error} = await client.from(abaCfg.id).insert(payload);
    if(error){ alert('Erro ao salvar: ' + error.message); return; }
    renderConteudoCardapio();
  });
}

function renderListaCrud(abaCfg){
  const el = document.getElementById('listaCrud-' + abaCfg.id);
  const linhas = cacheCardapio[abaCfg.id] || [];
  if(linhas.length === 0){ el.innerHTML = '<div class="empty">Nada cadastrado ainda</div>'; return; }

  el.innerHTML = linhas.map(l => {
    const temPreco = abaCfg.campos.some(c => c.key === 'preco');
    return `
    <div class="lista-item ${l.ativo === false ? 'inativo' : ''}">
      <div>
        <div class="nome-item">${l.nome}</div>
        <div class="sub-item">
          ${l.descricao ? l.descricao + ' · ' : ''}
          ${temPreco ? formatarPreco(l.preco) : ''}
          ${l.max_sabores ? ' · até ' + l.max_sabores + ' sabores' : ''}
        </div>
      </div>
      <div class="acoes">
        ${temPreco ? `<button class="icone-btn" data-editar-preco="${abaCfg.id}:${l.id}" title="editar preço">✏️</button>` : ''}
        <button class="icone-btn ${l.ativo === false ? 'sucesso' : 'perigo'}" data-toggle-ativo="${abaCfg.id}:${l.id}:${l.ativo === false ? 'true' : 'false'}">${l.ativo === false ? '↺' : '✕'}</button>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('[data-toggle-ativo]').forEach(btn => btn.addEventListener('click', async () => {
    const [tabela, id, novoValor] = btn.getAttribute('data-toggle-ativo').split(':');
    await client.from(tabela).update({ativo: novoValor === 'true'}).eq('id', id);
    renderConteudoCardapio();
  }));

  el.querySelectorAll('[data-editar-preco]').forEach(btn => btn.addEventListener('click', async () => {
    const [tabela, id] = btn.getAttribute('data-editar-preco').split(':');
    const atual = (cacheCardapio[tabela].find(x => x.id === id) || {}).preco;
    const novo = prompt('Novo preço:', atual);
    if(novo === null) return;
    const num = parseFloat(novo.replace(',', '.'));
    if(isNaN(num)){ alert('Valor inválido'); return; }
    await client.from(tabela).update({preco: num}).eq('id', id);
    renderConteudoCardapio();
  }));
}

// ---------------- ABA SABORES (com preço por tamanho) ----------------
let saboresExpandido = null;

async function renderAbaSabores(){
  const [saboresResp, tamanhosResp, precosResp] = await Promise.all([
    client.from('sabores').select('*').order('nome'),
    client.from('tamanhos').select('*').eq('ativo', true).order('ordem'),
    client.from('precos_sabor_tamanho').select('*'),
  ]);
  const sabores = saboresResp.data || [];
  const tamanhos = tamanhosResp.data || [];
  const precos = precosResp.data || [];
  cacheTamanhosGlobal = tamanhos;

  const cont = document.getElementById('conteudoCardapio');
  cont.innerHTML = `
    <div class="form-add">
      <h3 style="font-size:14px; margin-bottom:12px; color:var(--text-dim);">Adicionar sabor</h3>
      <div class="campo"><label>Nome</label><input type="text" id="novoSaborNome" placeholder="Ex: Portuguesa"></div>
      <div class="campo"><label>Tipo</label>
        <select id="novoSaborTipo"><option value="salgada">Salgada</option><option value="doce">Doce</option></select>
      </div>
      <div class="campo"><label>Ingredientes (opcional)</label><input type="text" id="novoSaborIngredientes" placeholder="Ex: presunto, ovos, ervilha"></div>
      <button class="btn-primario btn-full" id="btnAddSabor">Adicionar sabor</button>
    </div>
    <div id="listaSabores"></div>
  `;

  document.getElementById('btnAddSabor').addEventListener('click', async () => {
    const nome = document.getElementById('novoSaborNome').value.trim();
    if(!nome){ alert('Digita o nome do sabor'); return; }
    const tipo = document.getElementById('novoSaborTipo').value;
    const ingredientes = document.getElementById('novoSaborIngredientes').value.trim() || null;
    const {error} = await client.from('sabores').insert({nome, tipo, ingredientes});
    if(error){ alert('Erro: ' + error.message); return; }
    renderAbaSabores();
  });

  const listaEl = document.getElementById('listaSabores');
  if(sabores.length === 0){ listaEl.innerHTML = '<div class="empty">Nenhum sabor cadastrado</div>'; return; }
  if(tamanhos.length === 0){ listaEl.innerHTML = '<div class="empty">Cadastre um tamanho primeiro (aba Tamanhos) antes de definir preços.</div>'; return; }

  listaEl.innerHTML = sabores.map(s => {
    const expandido = saboresExpandido === s.id;
    return `
    <div class="lista-item ${s.ativo === false ? 'inativo' : ''}" style="flex-direction:column; align-items:stretch;">
      <div style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;" data-expandir-sabor="${s.id}">
        <div>
          <div class="nome-item">${s.nome}</div>
          <div class="sub-item">${s.tipo === 'doce' ? 'Doce' : 'Salgada'}${s.ingredientes ? ' · ' + s.ingredientes : ''}</div>
        </div>
        <div class="acoes">
          <button class="icone-btn ${s.ativo === false ? 'sucesso' : 'perigo'}" data-toggle-sabor="${s.id}:${s.ativo === false ? 'true' : 'false'}">${s.ativo === false ? '↺' : '✕'}</button>
          <span class="icone-btn">${expandido ? '▲' : '▼'}</span>
        </div>
      </div>
      ${expandido ? `
        <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--card-border);">
          <div class="sub-item" style="margin-bottom:8px;">Preço em cada tamanho:</div>
          <div class="grid2">
            ${tamanhos.map(t => {
              const p = precos.find(x => x.sabor_id === s.id && x.tamanho_id === t.id);
              return `
              <div class="campo" style="margin-bottom:8px;">
                <label>${t.nome}</label>
                <input type="number" step="0.01" id="preco-${s.id}-${t.id}" value="${p ? p.preco : ''}" placeholder="0,00">
              </div>`;
            }).join('')}
          </div>
          <button class="btn-secundario btn-full" data-salvar-precos="${s.id}">Salvar preços</button>
        </div>
      ` : ''}
    </div>`;
  }).join('');

  listaEl.querySelectorAll('[data-expandir-sabor]').forEach(el => el.addEventListener('click', () => {
    const id = el.getAttribute('data-expandir-sabor');
    saboresExpandido = saboresExpandido === id ? null : id;
    renderAbaSabores();
  }));

  listaEl.querySelectorAll('[data-toggle-sabor]').forEach(btn => btn.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    const [id, novoValor] = btn.getAttribute('data-toggle-sabor').split(':');
    await client.from('sabores').update({ativo: novoValor === 'true'}).eq('id', id);
    renderAbaSabores();
  }));

  listaEl.querySelectorAll('[data-salvar-precos]').forEach(btn => btn.addEventListener('click', async () => {
    const saborId = btn.getAttribute('data-salvar-precos');
    const linhas = [];
    for(const t of tamanhos){
      const val = document.getElementById(`preco-${saborId}-${t.id}`).value;
      if(val){
        linhas.push({sabor_id: saborId, tamanho_id: t.id, preco: Number(val)});
      }
    }
    if(linhas.length === 0){ alert('Preenche pelo menos um preço'); return; }
    const {error} = await client.from('precos_sabor_tamanho').upsert(linhas, {onConflict:'sabor_id,tamanho_id'});
    if(error){ alert('Erro ao salvar preços: ' + error.message); return; }
    alert('Preços salvos!');
    renderAbaSabores();
  }));
}

// ---------------- CONFIGURAÇÕES ----------------
async function renderConfig(){
  const {data} = await client.from('config_sistema').select('*').eq('id',1).single();
  const cfg = data || {};
  const cont = document.getElementById('conteudoConfig');
  cont.innerHTML = `
    <div class="card">
      <div class="campo"><label>Nome da pizzaria</label><input type="text" id="cfgNome" value="${cfg.nome_pizzaria || ''}"></div>

      <div class="campo"><label>Regra do meio a meio</label>
        <select id="cfgRegra">
          <option value="mais_caro" ${cfg.regra_meio_a_meio==='mais_caro'?'selected':''}>Cobra o valor do sabor mais caro</option>
          <option value="media" ${cfg.regra_meio_a_meio==='media'?'selected':''}>Cobra a média dos dois sabores</option>
        </select>
      </div>

      <label style="display:block; font-size:13px; color:var(--text-dim); margin-bottom:8px; font-weight:500;">Formas de pagamento aceitas</label>
      <div class="checkbox-linha"><input type="checkbox" id="cfgPixAntecipado" ${cfg.aceita_pix_antecipado?'checked':''}> <span>Pix antecipado</span></div>
      <div class="checkbox-linha"><input type="checkbox" id="cfgPixEntrega" ${cfg.aceita_pix_entrega?'checked':''}> <span>Pix na entrega</span></div>
      <div class="checkbox-linha"><input type="checkbox" id="cfgCartaoEntrega" ${cfg.aceita_cartao_entrega?'checked':''}> <span>Cartão na entrega</span></div>
      <div class="checkbox-linha"><input type="checkbox" id="cfgDinheiro" ${cfg.aceita_dinheiro?'checked':''}> <span>Dinheiro na entrega</span></div>

      <button class="btn-primario btn-full" id="btnSalvarConfig" style="margin-top:8px;">Salvar configurações</button>
    </div>
  `;
  document.getElementById('btnSalvarConfig').addEventListener('click', async () => {
    const btn = document.getElementById('btnSalvarConfig');
    btn.disabled = true; btn.textContent = 'Salvando...';
    const {error} = await client.from('config_sistema').update({
      nome_pizzaria: document.getElementById('cfgNome').value,
      regra_meio_a_meio: document.getElementById('cfgRegra').value,
      aceita_pix_antecipado: document.getElementById('cfgPixAntecipado').checked,
      aceita_pix_entrega: document.getElementById('cfgPixEntrega').checked,
      aceita_cartao_entrega: document.getElementById('cfgCartaoEntrega').checked,
      aceita_dinheiro: document.getElementById('cfgDinheiro').checked,
    }).eq('id',1);
    btn.disabled = false; btn.textContent = 'Salvar configurações';
    if(error){ alert('Erro ao salvar: ' + error.message); return; }
    alert('Configurações salvas!');
    carregarNomePizzaria();
  });
}
