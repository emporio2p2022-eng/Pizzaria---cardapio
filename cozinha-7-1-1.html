<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cozinha — Pizzaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: #1A1613;
    --bg-elev: #211C18;
    --card: #26201B;
    --card-border: #3A322A;
    --text: #F2EAE0;
    --text-dim: #A89A8A;
    --text-faint: #6E6255;
    --novo: #E85D3F;
    --novo-bg: rgba(232,93,63,0.10);
    --preparando: #E8A93F;
    --preparando-bg: rgba(232,169,63,0.10);
    --pronto: #4FA876;
    --pronto-bg: rgba(79,168,118,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 20px; background:var(--bg-elev);
    border-bottom:1px solid var(--card-border);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand h1{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:22px;
    letter-spacing:0.3px; margin:0; color:var(--text);
  }
  .dot{width:9px; height:9px; border-radius:50%; background:var(--text-faint); flex-shrink:0;}
  .dot.online{background:var(--pronto); box-shadow:0 0 8px var(--pronto);}
  .dot.offline{background:var(--novo); box-shadow:0 0 8px var(--novo);}
  .status-label{font-size:13px; color:var(--text-dim);}
  .clock{font-family:'Oswald',sans-serif; font-size:20px; color:var(--text-dim); font-weight:500;}

  main{
    display:flex; gap:14px; padding:14px;
    height: calc(100vh - 62px);
    max-height: calc(100dvh - 62px);
  }
  .col{
    flex:1; min-width:0; display:flex; flex-direction:column;
    background:var(--bg-elev); border-radius:14px; overflow:hidden;
    border:1px solid var(--card-border);
  }
  .col-head{
    padding: 14px 16px; display:flex; align-items:center; justify-content:space-between;
    border-bottom: 2px solid var(--card-border);
  }
  .col-head h2{
    font-family:'Oswald',sans-serif; font-size:18px; font-weight:600;
    margin:0; letter-spacing:0.3px;
  }
  .count{
    font-family:'Oswald',sans-serif; font-size:15px; font-weight:600;
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .col-novo .col-head h2, .col-novo .count{color:var(--novo);}
  .col-novo .count{background:var(--novo-bg);}
  .col-preparando .col-head h2, .col-preparando .count{color:var(--preparando);}
  .col-preparando .count{background:var(--preparando-bg);}
  .col-pronto .col-head h2, .col-pronto .count{color:var(--pronto);}
  .col-pronto .count{background:var(--pronto-bg);}

  .col-body{
    flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:12px;
  }
  .empty{
    color:var(--text-faint); text-align:center; padding:40px 10px; font-size:14px;
  }

  .card{
    background:var(--card); border:1px solid var(--card-border);
    border-radius:12px; padding:14px; border-left:4px solid var(--text-faint);
  }
  .col-novo .card{border-left-color:var(--novo);}
  .col-preparando .card{border-left-color:var(--preparando);}
  .col-pronto .card{border-left-color:var(--pronto);}
  .card.pulse{animation: pulse 1.1s ease-in-out 3;}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(232,93,63,0);}
    50%{box-shadow:0 0 0 6px rgba(232,93,63,0.25);}
  }

  .card-top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px;}
  .numero{font-family:'Oswald',sans-serif; font-size:26px; font-weight:700; color:var(--text);}
  .tempo{font-size:13px; color:var(--text-dim); font-weight:500;}
  .tempo.atrasado{color:var(--novo); font-weight:700;}

  .tipo-entrega{
    display:inline-flex; align-items:center; gap:5px; font-size:12px;
    color:var(--text-dim); margin-bottom:10px; font-weight:500;
  }

  .itens{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
  .item{font-size:14.5px; line-height:1.4;}
  .item .qtd{color:var(--preparando); font-weight:700; margin-right:4px;}
  .item .desc{color:var(--text); font-weight:600;}
  .item .extra{display:block; color:var(--text-dim); font-size:13px; margin-left:20px;}

  .obs{
    background:rgba(232,169,63,0.12); border:1px solid rgba(232,169,63,0.3);
    color:var(--preparando); padding:8px 10px; border-radius:8px;
    font-size:13.5px; margin-bottom:10px; font-weight:500;
  }

  .cliente-linha{font-size:13px; color:var(--text-dim); margin-bottom:12px;}

  button.avancar{
    width:100%; border:none; border-radius:9px; padding:13px;
    font-family:'Oswald',sans-serif; font-size:15px; font-weight:600;
    letter-spacing:0.3px; cursor:pointer; color:#1A1613;
  }
  .col-novo button.avancar{background:var(--novo); color:#fff;}
  .col-preparando button.avancar{background:var(--preparando);}
  .col-pronto button.avancar{background:var(--pronto); color:#fff;}
  button.avancar:active{transform:scale(0.97);}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--card-border); border-radius:3px;}

  @media (max-width: 820px){
    main{flex-direction:column; height:auto; max-height:none; overflow-y:visible;}
    .col{max-height:none;}
    .col-body{max-height:none; overflow-y:visible;}
  }
</style>
</head>
<body>
<div id="pwGate" style="position:fixed;inset:0;z-index:99999;background:#1c1310;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;">
  <div style="width:100%;max-width:320px;text-align:center;">
    <div style="font-size:40px;margin-bottom:12px;">🔒</div>
    <div style="color:#f3e7d9;font-size:18px;font-weight:600;margin-bottom:18px;">Acesso restrito — Pizzaria 2P</div>
    <input id="pwInput" type="password" placeholder="Senha" autocomplete="off"
      style="width:100%;padding:14px;border-radius:10px;border:1px solid #3a2a22;background:#271b17;color:#f3e7d9;font-size:16px;text-align:center;margin-bottom:12px;box-sizing:border-box;">
    <button id="pwBtn" style="width:100%;padding:14px;border-radius:10px;border:none;background:#e2683f;color:#fff;font-size:16px;font-weight:600;">Entrar</button>
    <div id="pwErr" style="color:#e2683f;font-size:13px;margin-top:10px;display:none;">Senha errada, tenta de novo.</div>
  </div>
</div>
<script>
(function(){
  var KEY = 'pizza2p_auth_v1';
  var SENHA = '2p2026';
  if(localStorage.getItem(KEY) === 'ok'){
    document.getElementById('pwGate').remove();
    return;
  }
  function tentar(){
    var val = document.getElementById('pwInput').value.trim();
    if(val === SENHA){
      localStorage.setItem(KEY, 'ok');
      document.getElementById('pwGate').remove();
    } else {
      document.getElementById('pwErr').style.display = 'block';
    }
  }
  document.getElementById('pwBtn').addEventListener('click', tentar);
  document.getElementById('pwInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') tentar();
  });
})();
</script>


<header>
  <div class="brand">
    <h1 id="nomePizzaria">Cozinha</h1>
    <div class="dot" id="connDot"></div>
    <span class="status-label" id="connLabel">conectando...</span>
  </div>
  <div class="clock" id="clock">--:--</div>
</header>

<main>
  <section class="col col-novo">
    <div class="col-head"><h2>Novo</h2><span class="count" id="countNovo">0</span></div>
    <div class="col-body" id="colNovo"></div>
  </section>
  <section class="col col-preparando">
    <div class="col-head"><h2>Preparando</h2><span class="count" id="countPreparando">0</span></div>
    <div class="col-body" id="colPreparando"></div>
  </section>
  <section class="col col-pronto">
    <div class="col-head"><h2>Pronto</h2><span class="count" id="countPronto">0</span></div>
    <div class="col-body" id="colPronto"></div>
  </section>
</main>

<script>
// ============================================================
// CONFIGURAÇÃO — dados do seu projeto Supabase
// ============================================================
const SUPABASE_URL = 'https://udqsxybmoomokgmhhubh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_y-3D9y_mQP5SvmUbVmbClg_5YSgU2sX';

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// mapas de referência (carregados uma vez)
let mapTamanhos = {}, mapSabores = {}, mapBordas = {}, mapBebidas = {}, mapCombos = {}, mapAdicionais = {};

// pedidos vistos, pra saber quando um é realmente novo (tocar som)
let idsConhecidos = new Set();
let primeiraCarga = true;

async function carregarReferencias(){
  const [tam, sab, bor, beb, com, adi] = await Promise.all([
    client.from('tamanhos').select('id,nome'),
    client.from('sabores').select('id,nome'),
    client.from('bordas').select('id,nome'),
    client.from('bebidas').select('id,nome'),
    client.from('combos').select('id,nome'),
    client.from('adicionais').select('id,nome'),
  ]);
  (tam.data||[]).forEach(r=>mapTamanhos[r.id]=r.nome);
  (sab.data||[]).forEach(r=>mapSabores[r.id]=r.nome);
  (bor.data||[]).forEach(r=>mapBordas[r.id]=r.nome);
  (beb.data||[]).forEach(r=>mapBebidas[r.id]=r.nome);
  (com.data||[]).forEach(r=>mapCombos[r.id]=r.nome);
  (adi.data||[]).forEach(r=>mapAdicionais[r.id]=r.nome);
}

async function carregarNomePizzaria(){
  const {data} = await client.from('config_sistema').select('nome_pizzaria').eq('id',1).single();
  if(data && data.nome_pizzaria) document.getElementById('nomePizzaria').textContent = data.nome_pizzaria;
}

function formatarItem(item){
  let desc = '';
  let qtd = item.quantidade || 1;
  if(item.tipo_item === 'pizza'){
    const tam = mapTamanhos[item.tamanho_id] || '';
    const s1 = mapSabores[item.sabor1_id] || '';
    const s2 = item.sabor2_id ? mapSabores[item.sabor2_id] : null;
    desc = `Pizza ${tam} — ${s1}` + (s2 ? ` / ${s2}` : '');
    if(item.borda_id && mapBordas[item.borda_id] && mapBordas[item.borda_id] !== 'Sem borda'){
      desc += ` (borda ${mapBordas[item.borda_id]})`;
    }
  } else if(item.tipo_item === 'bebida'){
    desc = mapBebidas[item.bebida_id] || 'Bebida';
  } else if(item.tipo_item === 'combo'){
    desc = mapCombos[item.combo_id] || 'Combo';
  } else {
    desc = 'Item';
  }
  const adicionais = (item._adicionais || [])
    .map(a => mapAdicionais[a.adicional_id])
    .filter(Boolean);
  return {qtd, desc, adicionais, obs: item.observacoes};
}

function tempoDecorrido(criadoEm){
  const min = Math.floor((Date.now() - new Date(criadoEm).getTime()) / 60000);
  if(min < 1) return 'agora';
  return `há ${min} min`;
}

function atualizarEsvaziosEContagens(){
  const mapas = [
    {col: document.getElementById('colNovo'), count: document.getElementById('countNovo'), msg: 'Nenhum pedido novo'},
    {col: document.getElementById('colPreparando'), count: document.getElementById('countPreparando'), msg: 'Nada em preparo'},
    {col: document.getElementById('colPronto'), count: document.getElementById('countPronto'), msg: 'Nada pronto'},
  ];
  mapas.forEach(({col, count, msg}) => {
    const cards = col.querySelectorAll('.card');
    count.textContent = cards.length;
    if(cards.length === 0 && !col.querySelector('.empty')){
      col.innerHTML = `<div class="empty">${msg}</div>`;
    }
  });
}

function iconeEntrega(tipo){
  return tipo === 'retirada' ? '🏠 Retirada no local' : '🛵 Entrega';
}

function criarCard(pedido, coluna){
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = pedido.id;

  const min = Math.floor((Date.now() - new Date(pedido.criado_em).getTime()) / 60000);
  const atrasado = min >= 20;

  const itensHtml = (pedido._itens || []).map(raw => {
    const it = formatarItem(raw);
    const extras = it.adicionais.length ? `<span class="extra">+ ${it.adicionais.join(', ')}</span>` : '';
    const obs = it.obs ? `<span class="extra">obs: ${it.obs}</span>` : '';
    return `<div class="item"><span class="qtd">${it.qtd}x</span><span class="desc">${it.desc}</span>${extras}${obs}</div>`;
  }).join('');

  const clienteNome = pedido.clientes ? (pedido.clientes.nome || pedido.clientes.telefone || '') : '';
  const bairro = pedido.enderecos_clientes ? (pedido.enderecos_clientes.bairro || '') : '';

  let botaoTxt = '', proximoStatus = '';
  if(coluna === 'novo'){ botaoTxt = 'Aceitar e começar'; proximoStatus = 'em_preparo'; }
  else if(coluna === 'preparando'){ botaoTxt = 'Marcar como pronto'; proximoStatus = 'pronto'; }
  else { botaoTxt = pedido.tipo_entrega === 'retirada' ? 'Cliente já retirou' : 'Saiu para entrega'; proximoStatus = pedido.tipo_entrega === 'retirada' ? 'retirado' : 'aguardando_motoboy'; }

  card.innerHTML = `
    <div class="card-top">
      <span class="numero">#${pedido.numero}</span>
      <span class="tempo ${atrasado ? 'atrasado' : ''}">${tempoDecorrido(pedido.criado_em)}</span>
    </div>
    <div class="tipo-entrega">${iconeEntrega(pedido.tipo_entrega)}${bairro ? ' · ' + bairro : ''}</div>
    <div class="itens">${itensHtml || '<div class="item">Sem itens</div>'}</div>
    ${pedido.observacoes ? `<div class="obs">⚠️ ${pedido.observacoes}</div>` : ''}
    ${clienteNome ? `<div class="cliente-linha">${clienteNome}</div>` : ''}
    <button class="avancar">${botaoTxt}</button>
  `;

  card.querySelector('button.avancar').addEventListener('click', async () => {
    const btn = card.querySelector('button.avancar');
    if(btn.disabled) return;
    btn.disabled = true; btn.textContent = 'Atualizando...';

    try {
      const {error} = await client.from('pedidos').update({status: proximoStatus}).eq('id', pedido.id);
      if(error){
        alert('Não consegui atualizar o pedido. Verifica a internet e tenta de novo.');
        btn.disabled = false; btn.textContent = botaoTxt;
        return;
      }
    } catch(e) {
      alert('Sem conexão no momento. Verifica a internet e tenta de novo.');
      btn.disabled = false; btn.textContent = botaoTxt;
      return;
    }

    // já confirmado pelo servidor: some com o card na hora,
    // sem depender de a tela inteira recarregar
    btn.textContent = 'Feito ✓';
    card.style.transition = 'opacity 0.3s';
    card.style.opacity = '0.3';
    setTimeout(() => { card.remove(); atualizarEsvaziosEContagens(); }, 450);

    // tenta sincronizar tudo em segundo plano; se falhar, não trava nada
    carregarPedidos().catch(() => {});
  });

  return card;
}

async function carregarPedidos(){
  const statusRelevantes = ['enviado_cozinha','aceito_cozinha','em_preparo','pronto'];
  let data, error;
  try {
    const resp = await client
      .from('pedidos')
      .select('*, itens_pedido(*, itens_pedido_adicionais(*)), clientes(nome,telefone), enderecos_clientes(bairro)')
      .in('status', statusRelevantes)
      .order('criado_em', {ascending: true});
    data = resp.data; error = resp.error;
  } catch(e) {
    error = e;
  }

  if(error){
    document.getElementById('connLabel').textContent = 'erro ao carregar';
    document.getElementById('connDot').className = 'dot offline';
    return;
  }

  document.getElementById('connDot').className = 'dot online';
  document.getElementById('connLabel').textContent = 'ao vivo';

  const colNovo = document.getElementById('colNovo');
  const colPreparando = document.getElementById('colPreparando');
  const colPronto = document.getElementById('colPronto');

  try {
    colNovo.textContent = ''; colPreparando.textContent = ''; colPronto.textContent = '';
  } catch(e) { /* ignora se o navegador travou a remoção nesse instante */ }

  let nNovo = 0, nPrep = 0, nPronto = 0;
  let idsAgora = new Set();

  (data || []).forEach(pedido => {
    pedido._itens = (pedido.itens_pedido || []).map(it => ({...it, _adicionais: it.itens_pedido_adicionais || []}));
    idsAgora.add(pedido.id);

    let coluna;
    if(pedido.status === 'enviado_cozinha' || pedido.status === 'aceito_cozinha') coluna = 'novo';
    else if(pedido.status === 'em_preparo') coluna = 'preparando';
    else coluna = 'pronto';

    const card = criarCard(pedido, coluna);

    if(!primeiraCarga && !idsConhecidos.has(pedido.id)){
      card.classList.add('pulse');
      tocarAlerta();
    }

    if(coluna === 'novo'){ colNovo.appendChild(card); nNovo++; }
    else if(coluna === 'preparando'){ colPreparando.appendChild(card); nPrep++; }
    else { colPronto.appendChild(card); nPronto++; }
  });

  if(nNovo === 0) colNovo.innerHTML = '<div class="empty">Nenhum pedido novo</div>';
  if(nPrep === 0) colPreparando.innerHTML = '<div class="empty">Nada em preparo</div>';
  if(nPronto === 0) colPronto.innerHTML = '<div class="empty">Nada pronto</div>';

  document.getElementById('countNovo').textContent = nNovo;
  document.getElementById('countPreparando').textContent = nPrep;
  document.getElementById('countPronto').textContent = nPronto;

  idsConhecidos = idsAgora;
  primeiraCarga = false;
}

let audioCtx = null;
function tocarAlerta(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18].forEach(delay => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.15, audioCtx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.15);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + delay);
      o.stop(audioCtx.currentTime + delay + 0.15);
    });
  }catch(e){}
}

// relógio
function atualizarRelogio(){
  const agora = new Date();
  document.getElementById('clock').textContent = agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}
setInterval(atualizarRelogio, 1000);
atualizarRelogio();

// atualizar "há X min" nos cards sem precisar recarregar tudo
setInterval(() => { if(!primeiraCarga) carregarPedidos(); }, 30000);

// inicialização
(async () => {
  await carregarReferencias();
  await carregarNomePizzaria();
  await carregarPedidos();

  client
    .channel('cozinha-pedidos')
    .on('postgres_changes', {event:'*', schema:'public', table:'pedidos'}, () => carregarPedidos())
    .on('postgres_changes', {event:'*', schema:'public', table:'itens_pedido'}, () => carregarPedidos())
    .subscribe((status) => {
      if(status === 'SUBSCRIBED'){
        document.getElementById('connDot').className = 'dot online';
        document.getElementById('connLabel').textContent = 'ao vivo';
      }
    });
})();

// quando o celular volta a mostrar a tela (depois de trocar de app, apagar tela, etc),
// a conexão pode ter caído sem avisar — força atualizar tudo de novo
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && !primeiraCarga){
    carregarPedidos();
  }
});

// clicar em qualquer lugar da tela uma vez libera o som no celular (política dos navegadores)
document.addEventListener('click', () => {
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}, {once:true});
</script>

</body>
</html>
